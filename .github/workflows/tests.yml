name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gnn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # Only what the GNN tests import; the CPU build of torch keeps the install small.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install torch_geometric numpy pandas scikit-learn xgboost pytest
      - run: python -m pytest -q tests   # -m puts the repo root on sys.path, where gnn/ lives

  kedro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kedro
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kedro/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
