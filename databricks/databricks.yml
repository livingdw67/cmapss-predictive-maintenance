# Databricks Asset Bundle for the C-MAPSS pipeline on Databricks (Free Edition, serverless).
# Deploy:  databricks bundle deploy --profile free
# Run:     databricks bundle run cmapss_pipeline --profile free
bundle:
  name: cmapss-predictive-maintenance

variables:
  catalog:
    description: Unity Catalog catalog that holds the schema
    default: workspace
  schema:
    description: Schema for every table, the raw-file volume and the registered models
    default: cmapss

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-303976ab-2cd1.cloud.databricks.com
